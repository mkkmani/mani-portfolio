name: PR Checks

# Trigger this workflow on pull request events
on:
  pull_request:
    branches:
      - main
      - dev
    types: [opened, synchronize, reopened]

jobs:
  install-and-build:
    name: Install & Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
        
      - name: Build project
        run: npm run build
        
      - name: Report success
        if: success()
        run: echo "✅ All checks passed! PR is ready to merge."
        
      - name: Report failure
        if: failure()
        run: |
          echo "❌ Checks failed! Please fix the issues before merging."
          exit 1
